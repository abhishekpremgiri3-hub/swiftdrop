name: Build SwiftDrop APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SwiftDrop Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SwiftDrop
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify SwiftDrop web files
        run: |
          test -d www
          test -f www/index.html
          echo "SwiftDrop www/ directory found."

      - name: Install npm dependencies
        run: npm install

      - name: Verify Capacitor
        run: npx cap --version

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already exists."
          fi

      - name: Sync SwiftDrop with Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SwiftDrop APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftDrop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: errorname: Build SwiftDrop APK

